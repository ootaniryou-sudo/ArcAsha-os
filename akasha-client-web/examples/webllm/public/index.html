<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#000000" />
  <title>ArcAsha × WebLLM PoC</title>
  <style>
    :root { --bg0:#000; --ink:#e7f2ea; --mute:#5e7488; --go:#2fce7a; --busy:#e0b84a; --bad:#e05a4f; }
    * { box-sizing:border-box; margin:0; padding:0; }
    html,body {
      min-height:100dvh; background:var(--bg0); color:var(--ink);
      font-family:"IBM Plex Mono","SF Mono",ui-monospace,monospace;
      font-size:13px; -webkit-font-smoothing:antialiased;
      overscroll-behavior:none; user-select:none; -webkit-user-select:none;
    }
    #app {
      display:flex; flex-direction:column; min-height:100dvh;
      max-width:560px; margin:0 auto; padding:16px;
      padding-top:max(16px, env(safe-area-inset-top));
      padding-bottom:max(16px, env(safe-area-inset-bottom));
      gap:10px;
    }
    h1 { font-size:18px; font-weight:800; letter-spacing:0.04em; }
    h1 span { color:var(--go); }
    #gpu { font-size:11px; color:var(--mute); }
    #gpu.ok { color:var(--go); }
    #gpu.bad { color:var(--bad); }
    .row { display:flex; gap:8px; align-items:center; }
    select, input {
      flex:1; padding:10px 12px;
      background:#111; border:1px solid #222; border-radius:6px;
      color:var(--ink); font:inherit; font-size:13px; outline:none;
    }
    select:focus, input:focus { border-color:var(--go); }
    button {
      padding:10px 16px; border:none; border-radius:6px;
      background:var(--go); color:#000; font:inherit; font-size:13px; font-weight:700;
      cursor:pointer;
    }
    button:disabled { opacity:0.4; }
    #status { font-size:11px; color:var(--mute); min-height:16px; }
    #status.bad { color:var(--bad); }
    #progress { font-size:11px; color:var(--busy); min-height:14px; word-break:break-all; }
    #output {
      flex:1; min-height:200px; overflow-y:auto;
      background:#0a0f0c; border:1px solid #1a2a22; border-radius:8px;
      padding:12px; display:flex; flex-direction:column; gap:8px;
    }
    .msg { font-size:13px; line-height:1.5; white-space:pre-wrap; word-break:break-word; }
    .msg.user { color:#9fd8ff; align-self:flex-end; text-align:right; }
    .msg.assistant { color:var(--ink); align-self:flex-start; }
    #stats { font-size:11px; color:var(--mute); min-height:14px; }
    .bottom { display:flex; gap:8px; }
  </style>
</head>
<body>
  <div id="app">
    <h1>ArcAsha × <span>WebLLM</span></h1>
    <div id="gpu">WebGPU: 確認中…</div>
    <div class="row">
      <select id="model"></select>
      <button id="btnLoad">Load</button>
    </div>
    <div id="status">モデルを選択して Load</div>
    <div id="progress"></div>
    <div id="output"></div>
    <div id="stats"></div>
    <div class="bottom">
      <input id="input" type="text" placeholder="メッセージ…" autocomplete="off" />
      <button id="btnSend" disabled>Send</button>
    </div>
  </div>
  <script type="module" src="./dist/main.js"></script>
</body>
</html>
