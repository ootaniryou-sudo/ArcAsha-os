[package]
name = "akasha-kernel"
version = "0.1.0"
edition = "2021"
description = "Akasha-OS native edge runtime — zero-copy GPU inference over QUIC"
license = "MIT"
authors = ["Akasha-OS Contributors"]

[lib]
name = "akasha_kernel"
crate-type = ["lib", "cdylib", "staticlib"]
path = "src/lib.rs"

[[bin]]
name = "akasha-kernel"
path = "src/main.rs"

[features]
default = ["wgpu", "tokio", "quic"]
# Platform feature flags
android-foreground = []
ios-background = []
# GPU backend selection (auto-detected; overridable for cross-compile)
vulkan = ["wgpu/vulkan-portability"]
metal = ["wgpu/metal"]
dx12 = ["wgpu/dx12"]
# Use QUIC (default) or fall back to raw TCP
quic = ["quinn", "rustls", "rcgen"]
tcp-only = ["tokio"]

[dependencies]
# ── Async runtime ──
tokio = { version = "1", features = ["full", "sync", "signal"], optional = true }

# ── GPU compute (cross-platform: Vulkan / Metal / DX12 / GLES) ──
wgpu = { version = "22", features = ["spirv"], optional = true }
bytemuck = { version = "1", features = ["derive"] }
encase = "0.8"

# ── QUIC transport ──
quinn = { version = "0.11", optional = true }
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring"] }
rcgen = { version = "0.13", optional = true }

# ── Binary protocol ──
byteorder = "1.5"

# ── Logging ──
log = "0.4"
env_logger = "0.11"

# ── Error handling ──
thiserror = "2"

# ── Async traits (used by Transport / Platform) ──
async-trait = "0.1"

# ── Platform detection / JNI ──
[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.21", features = ["invocation"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.dev]
opt-level = 1
