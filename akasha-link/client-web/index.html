<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#000000" />
  <title>Akasha Edge</title>
  <style>
    :root { --bg0:#000000; --ink:#e7f2ea; --mute:#5e7488; --go:#2fce7a; --busy:#e0b84a; --bad:#e05a4f; --glow:rgba(47,206,122,0.3); }
    * { box-sizing:border-box; margin:0; padding:0; }
    html,body {
      min-height:100dvh; background:var(--bg0); color:var(--ink);
      font-family:"IBM Plex Mono","SF Mono",ui-monospace,monospace;
      font-size:13px; -webkit-font-smoothing:antialiased;
      overscroll-behavior:none; user-select:none; -webkit-user-select:none;
    }
    #setup {
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      min-height:100dvh; padding:24px; gap:16px;
    }
    #setup h1 { font-size:36px; font-weight:800; letter-spacing:0.04em; }
    #setup h1 span { color:var(--go); }
    #setup .desc { color:var(--mute); font-size:12px; text-align:center; max-width:280px; line-height:1.6; }
    #setup input {
      width:100%; max-width:300px; padding:12px 14px;
      background:#111; border:1px solid #222; border-radius:6px;
      color:var(--ink); font:inherit; font-size:14px; outline:none;
    }
    #setup input:focus { border-color:var(--go); }
    #btnBenchmark {
      width:100%; max-width:300px; padding:16px;
      background:var(--go); color:#000; border:none; border-radius:8px;
      font:inherit; font-size:16px; font-weight:700; letter-spacing:0.04em;
      cursor:pointer; transition:transform 0.1s,opacity 0.1s;
    }
    #btnBenchmark:active { transform:scale(0.97); opacity:0.85; }
    #btnBenchmark:disabled { opacity:0.5; }
    #benchResult { font-size:11px; color:var(--mute); text-align:center; min-height:40px; }
    #benchResult .aps { color:var(--go); font-size:22px; font-weight:700; }
    .hidden { display:none !important; }

    /* ── Stealth OLED screen ───────────────────── */
    #stealth {
      display:none; position:fixed; inset:0;
      background:#000000;
      flex-direction:column; align-items:center; justify-content:center;
    }
    #stealth.active { display:flex; }
    .stealth-dot {
      width:6px; height:6px; border-radius:50%;
      background:var(--go); box-shadow:0 0 6px var(--glow);
      opacity:0; transition:background 0.4s;
    }
    .stealth-dot.pulse { animation:stealthPulse 3s ease-in-out infinite; }
    .stealth-dot.computing {
      opacity:0.7; background:var(--busy);
      animation:stealthCompute 1.2s ease-in-out infinite;
    }
    .stealth-dot.offline {
      opacity:0; background:var(--bad);
      animation:stealthPulse 6s ease-in-out infinite;
    }
    @keyframes stealthPulse {
      0%,100% { opacity:0; }
      10% { opacity:0.5; }
      20% { opacity:0; }
    }
    @keyframes stealthCompute {
      0%,100% { opacity:0.25; }
      50% { opacity:0.9; }
    }
  </style>
</head>
<body>

<div id="setup">
  <h1>Aka<span>sha</span></h1>
  <p class="desc">エッジ推論ノード · WebGPU Worker<br>タップでベンチマーク → 自動接続 → ステルスモード</p>
  <input id="url" value="ws://192.168.10.1:8080" placeholder="Master WebSocket URL" autocomplete="off" spellcheck="false" />
  <input id="nodeId" value="phone-edge-01" maxlength="16" placeholder="Node ID" autocomplete="off" />
  <button id="btnBenchmark" type="button">⚡ ベンチマーク実行 &amp; 接続</button>
  <div id="benchResult"></div>
</div>

<div id="stealth" aria-hidden="true">
  <div class="stealth-dot pulse" id="stealthDot"></div>
</div>

<script type="module">
const $=id=>document.getElementById(id);
const setup=$('setup'),stealth=$('stealth'),stealthDot=$('stealthDot');
const btn=$('btnBenchmark'),benchResult=$('benchResult');
const urlInput=$('url'),nodeIdInput=$('nodeId');

let worker=null,wakeLock=null,connected=false,apsScore=0;

async function acquireWakeLock(){
  try{if('wakeLock' in navigator){wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener('release',()=>{if(connected)acquireWakeLock()})}}catch{}
}

function keepAlive(){if(connected)requestAnimationFrame(keepAlive)}

function enterStealth(){
  setup.classList.add('hidden');stealth.classList.add('active');
  stealthDot.className='stealth-dot pulse';acquireWakeLock();requestAnimationFrame(keepAlive);
}
function exitStealth(){
  setup.classList.remove('hidden');stealth.classList.remove('active');
  stealthDot.className='stealth-dot offline';connected=false;
  if(wakeLock){wakeLock.release().catch(()=>{});wakeLock=null}
}

async function runBenchmark(){
  benchResult.innerHTML='<span style="color:var(--busy)">⏳ GPU初期化中...</span>';
  if(!navigator.gpu){benchResult.innerHTML='<span style="color:var(--bad)">⚠ WebGPU非対応</span>';return null}
  try{
    const adapter=await navigator.gpu.requestAdapter({powerPreference:'high-performance'});
    if(!adapter){benchResult.innerHTML='<span style="color:var(--bad)">⚠ GPUアダプタなし</span>';return null}
    const device=await adapter.requestDevice({requiredLimits:{maxStorageBufferBindingSize:64*1024*1024,maxBufferSize:64*1024*1024}});
    benchResult.innerHTML='<span style="color:var(--busy)">⚙ 行列演算ベンチマーク実行中...</span>';
    const N=2048;const size=N*N*4;
    const bufA=device.createBuffer({size,usage:0x80|0x08,mappedAtCreation:true});
    const bufB=device.createBuffer({size,usage:0x80|0x08,mappedAtCreation:true});
    const bufC=device.createBuffer({size,usage:0x80|0x04});
    const A=new Float32Array(N*N),B=new Float32Array(N*N);
    for(let i=0;i<N*N;i++){A[i]=(Math.random()*2-1)*0.01;B[i]=(Math.random()*2-1)*0.01}
    new Float32Array(bufA.getMappedRange()).set(A);bufA.unmap();
    new Float32Array(bufB.getMappedRange()).set(B);bufB.unmap();
    const shader=device.createShaderModule({code:`@group(0)@binding(0)var<storage,read>A:array<f32>;@group(0)@binding(1)var<storage,read>B:array<f32>;@group(0)@binding(2)var<storage,read_write>C:array<f32>;@compute@workgroup_size(8,8)fn main(@builtin(global_invocation_id)gid:vec3<u32>){let row=gid.x;let col=gid.y;if(row>=2048u||col>=2048u){return;}var sum:f32=0.0;for(var k:u32=0u;k<2048u;k++){sum+=A[row*2048u+k]*B[k*2048u+col];}C[row*2048u+col]=sum;}`});
    const pipeline=device.createComputePipeline({layout:'auto',compute:{module:shader,entryPoint:'main'}});
    const bg=device.createBindGroup({layout:pipeline.getBindGroupLayout(0),entries:[{binding:0,resource:{buffer:bufA}},{binding:1,resource:{buffer:bufB}},{binding:2,resource:{buffer:bufC}}]});
    {const e=device.createCommandEncoder();const p=e.beginComputePass();p.setPipeline(pipeline);p.setBindGroup(0,bg);p.dispatchWorkgroups(256,256);p.end();device.queue.submit([e.finish()])}
    await device.queue.onSubmittedWorkDone();
    const ITER=15,start=performance.now();
    for(let i=0;i<ITER;i++){const e=device.createCommandEncoder();const p=e.beginComputePass();p.setPipeline(pipeline);p.setBindGroup(0,bg);p.dispatchWorkgroups(256,256);p.end();device.queue.submit([e.finish()])}
    await device.queue.onSubmittedWorkDone();
    const gpuMs=(performance.now()-start)/ITER;
    apsScore=Math.round(1000/(gpuMs+0.25));
    benchResult.innerHTML=`<span class="aps">APS:${apsScore}</span><br><span style="color:var(--mute)">GPU:${gpuMs.toFixed(2)}ms/matmul · 2048²</span>`;
    return {device,gpuMs,aps:apsScore};
  }catch(err){benchResult.innerHTML=`<span style="color:var(--bad)">⚠ 失敗:${err}</span>`;return null}
}

function spawnWorker(result){
  if(worker){worker.terminate();worker=null}
  worker=new Worker('./public/worker-inference.js',{type:'module'});
  worker.postMessage({type:'init',masterUrl:urlInput.value,nodeId:nodeIdInput.value,aps:result.aps,gpuMs:result.gpuMs});
  worker.onmessage=(ev)=>{const m=ev.data;if(m.type==='connected'){connected=true;stealthDot.className='stealth-dot pulse'}else if(m.type==='computing'){stealthDot.className='stealth-dot computing'}else if(m.type==='idle'){stealthDot.className='stealth-dot pulse'}else if(m.type==='disconnected'){exitStealth()}};
  worker.onerror=()=>exitStealth();
}

btn.addEventListener('click',async()=>{btn.disabled=true;btn.textContent='⏳ ベンチマーク中...';const r=await runBenchmark();if(r){btn.textContent='🔗 接続中...';spawnWorker(r);localStorage.setItem('akasha-master-url',urlInput.value);setTimeout(()=>enterStealth(),600)}else{btn.disabled=false;btn.textContent='⚡ ベンチマーク実行 & 接続'}});

const saved=localStorage.getItem('akasha-master-url');if(saved)urlInput.value=saved;
</script>
</body>
</html>
