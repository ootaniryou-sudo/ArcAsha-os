name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: build + selftests (akasha-master)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: akasha-master
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: akasha-master/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript build
        run: npm run build

      - name: AILSM selftest [1]-[89]
        run: npm run ailsm:selftest

      - name: AILSM golden (30 cases)
        run: npm run ailsm:golden

      - name: AILSA selftest
        run: npm run ailsa:selftest

  akasha-link:
    name: build + tests (akasha-link)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Native kernel (Rust) — cargo check + test
        working-directory: akasha-link/kernel-native
        run: |
          cargo check
          cargo test

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Web client (WebGPU) — typecheck + esbuild bundle
        working-directory: akasha-link/client-web
        run: |
          npm ci
          npx tsc --noEmit
          npm run build
