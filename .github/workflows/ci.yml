name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: build + selftests (akasha-master)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: akasha-master
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: akasha-master/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript build
        run: npm run build

      - name: AILSM selftest [1]-[72]
        run: npm run ailsm:selftest

      - name: AILSM golden (30 cases)
        run: npm run ailsm:golden

      - name: AILSA selftest
        run: npm run ailsa:selftest

  akasha-link:
    name: build + tests (akasha-link)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Native kernel (Rust) — cargo check + test
        working-directory: akasha-link/kernel-native
        run: |
          cargo check
          cargo test

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Web client (WebGPU) — esbuild bundle
        working-directory: akasha-link/client-web
        run: |
          npm install
          npm run build
