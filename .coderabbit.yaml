# CodeRabbit 設定
# ドキュメント: https://docs.coderabbit.ai/
# リポジトリ直下の .coderabbit.yaml は Repository Settings（UI）より優先される。
# ただし Organization Global Overrides と Enterprise の Workspace Global Overrides は上位。

language: ja-JP

early_access: false
reviews:
  profile: assertive
  request_changes_workflow: true
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: true
  auto_review:
    enabled: true
    drafts: false
  path_instructions:
    - path: akasha-master/src/arcasha/bench/**/*.ts
      instructions: |
        ベンチ計測コード。数値を偽装しないこと（kind: real-api / real-device / simulation を明示）。
        実測値は計算・ログから得た値のみを使うこと。
    - path: akasha-link/kernel-native/**/*.rs
      instructions: |
        Rust ネイティブカーネル。unsafe は最小限にし、エラーハンドリングを明示すること。

chat:
  auto_reply: true
